version: "3.8"

services:
  web:
    image: ${DOCKER_USERNAME:-GooneyIsCoding}/oral-app-web:${VERSION:-latest}
    container_name: oral-app-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - app_network
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Next.js 环境变量
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:3001}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - NEXT_PUBLIC_APP_NAME=${APP_NAME:-Oral App}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  api:
    image: ${DOCKER_USERNAME:-GooneyIsCoding}/oral-app-api:${VERSION:-latest}
    container_name: oral-app-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - app_network
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 数据库配置
      - DATABASE_URL=${DATABASE_URL}
      # CORS配置
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${DOMAIN}}
      # Better Auth配置
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      # Pusher配置
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_KEY=${PUSHER_KEY}
      - PUSHER_SECRET=${PUSHER_SECRET}
      - PUSHER_CLUSTER=${PUSHER_CLUSTER}
      - PUSHER_FORCE_TLS=${PUSHER_FORCE_TLS:-true}
      - PUSHER_HOST=${PUSHER_HOST}
      # Ably配置
      - ABLY_API_KEY=${ABLY_API_KEY}
      - ABLY_ENVIRONMENT=${ABLY_ENVIRONMENT:-production}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - api_logs:/app/logs
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

# 定义持久化存储
volumes:
  api_logs:
    driver: local

# 定义网络
networks:
  app_network:
    driver: bridge
    name: oral-app-network 